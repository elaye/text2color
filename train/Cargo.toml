[package]
name = "text2color-train"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
text2color = { path = ".." }
burn = { version = "0.22", default-features = false, features = ["std", "flex", "autodiff", "optim", "store"] }
rand = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
palette = { version = "0.7", default-features = false, features = ["std", "named"] }

[features]
cuda = ["burn/cuda"]
