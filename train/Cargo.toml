[package]
name = "text2color-train"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
text2color = { path = ".." }
burn = { version = "0.22", default-features = false, features = ["std", "flex", "autodiff", "optim", "store"] }
rand = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
palette = { version = "0.7", default-features = false, features = ["std", "named"] }
unicode-normalization = "0.1"
linfa = "0.8.1"
linfa-clustering = "0.8.1"
ndarray = "0.16"

[features]
cuda = ["burn/cuda"]
